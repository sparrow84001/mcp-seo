name: Build & Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        target:
          - os: windows-latest
            name: windows-x64
            outfile: bin/mcp-seo-windows-x64.exe
          - os: ubuntu-latest
            name: linux-x64
            outfile: bin/mcp-seo-linux-x64
          - os: macos-latest
            name: darwin-arm64
            outfile: bin/mcp-seo-darwin-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Output Directory
        shell: bash
        run: mkdir -p bin

      - name: Compile Standalone Native Binary
        shell: bash
        run: bun build --compile --minify ./src/index.ts --outfile "${{ matrix.target.outfile }}"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-seo-${{ matrix.target.name }}
          path: ${{ matrix.target.outfile }}

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true

  publish-mcp-registry:
    name: Auto-Publish to Official MCP Registry
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to Official MCP Registry
        continue-on-error: true
        run: ./mcp-publisher publish || true


  publish-smithery:
    name: Auto-Trigger Smithery.ai Indexer
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Trigger Smithery Indexer
        continue-on-error: true
        run: bunx @smithery/cli mcp publish https://mcp-seo-5dl7.onrender.com -n sparrow8400/mcp-seo || true


